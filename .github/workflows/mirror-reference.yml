name: Download reference site
on:
  push:
    branches:
      - arena/f9eedfbf-utility-bites
    paths:
      - .github/workflows/mirror-reference.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader
        run: |
          git clone --depth 1 https://github.com/PKHarsimran/website-downloader.git /tmp/website-downloader
          python -m pip install '/tmp/website-downloader[render]'
          python -m playwright install --with-deps chromium
      - name: Download reference
        run: website-downloader --url https://bitesizedutilities.vercel.app/ --destination mirror --max-pages 20 --render-js
      - name: Save original HTML
        run: curl -fsSL https://bitesizedutilities.vercel.app/ -o mirror/original.html
      - name: Upload mirror
        uses: actions/upload-artifact@v4
        with:
          name: reference-mirror
          path: mirror/
          if-no-files-found: error
      - name: Save mirror to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror/
          if ! git diff --cached --quiet; then
            git commit -m "Add downloaded reference site"
            git push origin HEAD:arena/f9eedfbf-utility-bites
          fi
